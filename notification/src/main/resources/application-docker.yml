spring:
  application:
    name: notification
  cloud:
    function:
      definition: orderCreated
    stream:
      bindings:
        orderCreated-in-0:
          destination: order.exchange
          group: notification-group
          content-type: application/json
      kafka:
        binder:
          brokers: kafka:9092
          configuration:
            value.deserializer: org.apache.kafka.common.serialization.StringDeserializer


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:dummy@gmail.com}
    password: ${EMAIL_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8084
