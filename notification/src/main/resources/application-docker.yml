spring:
  application:
    name: notification
  cloud:
    function:
      definition: orderCreated
    stream:
      bindings:
        orderCreated-in-0:
          destination: order.exchange
          group: notification-group
          content-type: application/json
      kafka:
        binder:
          brokers: kafka:9092
          configuration:
            value.deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8084